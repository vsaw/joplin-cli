name: CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build code
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run automated tests
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=json-summary

      - name: Publish coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Coverage — Node ${{ matrix.node-version }}"
            echo ""
            echo "| Metric | % | Covered / Total |"
            echo "| --- | ---: | ---: |"
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              for (const k of ["statements", "branches", "functions", "lines"]) {
                const m = t[k];
                console.log(`| ${k} | ${m.pct}% | ${m.covered} / ${m.total} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"
